<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.75">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="0.55" stop-color="#1b2136"/>
      <stop offset="1" stop-color="#10121d"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="200"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="6">
      <circle cx="512" cy="512" r="180"/>
      <circle cx="512" cy="512" r="260"/>
      <circle cx="512" cy="512" r="340"/>
      <circle cx="512" cy="512" r="420"/>
      <circle cx="512" cy="512" r="500"/>
    </g>
    <g transform="translate(512,512) scale(1.28) translate(-512,-512)">

  <!-- Adaptive-icon FOREGROUND layer: transparent background.
       Crossed like swords: teal Telecaster (body lower-right, neck to upper-left)
       x red Gibson SG (body lower-left, neck to upper-right), TTB above/in front. -->
  <defs>
    <linearGradient id="sgBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0343c"/>
      <stop offset="1" stop-color="#8f1219"/>
    </linearGradient>
    <linearGradient id="teleBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33c2b6"/>
      <stop offset="1" stop-color="#137a77"/>
    </linearGradient>
  </defs>

  <g transform="translate(512,512) scale(0.88) translate(-512,-512)">

    <!-- ============ TELECASTER: body lower-right, neck up-left ============ -->
    <g transform="translate(654,655) rotate(-40) scale(0.70)">
      <!-- neck (maple) -->
      <rect x="-19" y="-580" width="38" height="445" rx="7" fill="#d9a45b" stroke="#8a5f2a" stroke-width="7"/>
      <!-- frets -->
      <g stroke="#f0d9ae" stroke-width="6">
        <line x1="-16" y1="-510" x2="16" y2="-510"/>
        <line x1="-16" y1="-435" x2="16" y2="-435"/>
        <line x1="-16" y1="-360" x2="16" y2="-360"/>
        <line x1="-16" y1="-285" x2="16" y2="-285"/>
        <line x1="-16" y1="-210" x2="16" y2="-210"/>
      </g>
      <!-- Tele headstock: rounded paddle bulging to one side -->
      <path d="M -19,-580 L -19,-700 C -19,-730 8,-742 30,-732 C 56,-720 62,-690 52,-660 L 28,-580 Z"
            fill="#d9a45b" stroke="#8a5f2a" stroke-width="7"/>
      <!-- tuners -->
      <g fill="#8a5f2a">
        <circle cx="-6" cy="-700" r="7"/>
        <circle cx="0" cy="-668" r="7"/>
        <circle cx="6" cy="-636" r="7"/>
      </g>
      <!-- body: single-cut slab -->
      <path d="M -24,-150
               C -70,-166 -128,-158 -152,-110
               C -176,-60 -172,-6 -160,40
               C -148,90 -140,130 -96,164
               C -48,200 52,200 100,164
               C 146,130 158,84 158,30
               C 158,-30 150,-90 118,-128
               C 96,-152 60,-160 30,-148
               C 22,-145 -12,-145 -24,-150 Z"
            fill="url(#teleBody)" stroke="#0d5a58" stroke-width="9"/>
      <!-- white pickguard (left crescent) -->
      <path d="M -30,-140 C -70,-150 -118,-140 -138,-96 C -156,-52 -152,0 -142,40 C -104,66 -72,52 -60,16 C -46,-28 -44,-86 -30,-140 Z"
            fill="#f2ede2" opacity="0.95"/>
      <!-- control plate -->
      <rect x="76" y="-16" width="42" height="128" rx="20" fill="#c9ccd4" stroke="#7d8089" stroke-width="5"/>
      <!-- bridge + pickup -->
      <rect x="-34" y="-44" width="68" height="26" rx="8" fill="#2a2d33"/>
      <rect x="-40" y="8" width="80" height="42" rx="10" fill="#a8adb8" stroke="#5c5f66" stroke-width="4"/>
    </g>

    <!-- ============ GIBSON SG: body lower-left, neck up-right ============ -->
    <g transform="translate(370,655) rotate(40) scale(0.70)">
      <!-- neck (dark mahogany) -->
      <rect x="-19" y="-580" width="38" height="445" rx="7" fill="#4a2c1c" stroke="#241108" stroke-width="7"/>
      <!-- frets -->
      <g stroke="#c9b28f" stroke-width="6">
        <line x1="-16" y1="-510" x2="16" y2="-510"/>
        <line x1="-16" y1="-435" x2="16" y2="-435"/>
        <line x1="-16" y1="-360" x2="16" y2="-360"/>
        <line x1="-16" y1="-285" x2="16" y2="-285"/>
        <line x1="-16" y1="-210" x2="16" y2="-210"/>
      </g>
      <!-- Gibson headstock: flaring with open-book top -->
      <path d="M -19,-580 L -42,-700 C -42,-712 -26,-702 0,-702 C 26,-702 42,-712 42,-700 L 19,-580 Z"
            fill="#1c1410" stroke="#000000" stroke-width="7"/>
      <!-- tuners -->
      <g fill="#c9b28f">
        <circle cx="-24" cy="-676" r="7"/>
        <circle cx="-20" cy="-644" r="7"/>
        <circle cx="-16" cy="-612" r="7"/>
        <circle cx="24" cy="-676" r="7"/>
        <circle cx="20" cy="-644" r="7"/>
        <circle cx="16" cy="-612" r="7"/>
      </g>
      <!-- body: double-cutaway, pointed horns -->
      <path d="M -26,-140
               C -60,-118 -96,-130 -128,-178
               C -142,-198 -150,-192 -148,-168
               C -144,-116 -132,-72 -150,-24
               C -168,28 -160,92 -120,140
               C -70,196 74,196 122,140
               C 160,92 166,30 150,-22
               C 134,-72 142,-116 146,-166
               C 148,-190 140,-196 126,-176
               C 96,-130 60,-118 26,-140
               C 10,-130 -10,-130 -26,-140 Z"
            fill="url(#sgBody)" stroke="#5c0a10" stroke-width="9"/>
      <!-- humbuckers -->
      <rect x="-48" y="-70" width="96" height="34" rx="8" fill="#e8ddc4" stroke="#3a2f1c" stroke-width="4"/>
      <rect x="-48" y="-18" width="96" height="34" rx="8" fill="#e8ddc4" stroke="#3a2f1c" stroke-width="4"/>
      <!-- tailpiece -->
      <rect x="-36" y="36" width="72" height="18" rx="8" fill="#2a2d33"/>
    </g>

    <!-- ============ TTB LETTERS (in front, across the crossing point) ============ -->
    <g>
      <text x="512" y="505" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
            font-size="210" text-anchor="middle" fill="none" stroke="#14161f" stroke-width="44"
            stroke-linejoin="round">TTB</text>
      <text x="512" y="505" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
            font-size="210" text-anchor="middle" fill="#f6edd8">TTB</text>
    </g>

  </g>

    </g>
  </g>
</svg>
